services:
  web:
    build: .
    container_name: swps_study_app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/code/data
      - ./backups:/code/backups
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/consent')"]
      interval: 30s
      timeout: 5s
      retries: 3

  backup:
    image: alpine:latest
    container_name: swps_study_backup
    restart: unless-stopped
    volumes:
      - ./data:/data
      - ./backups:/backups
    command: >
      sh -c "apk add --no-cache sqlite &&
      while true; do
        if [ -f /data/study_data.db ]; then
          sqlite3 /data/study_data.db \".backup '/backups/study_data_$$(date +%Y%m%d_%H%M).db'\";
          find /backups -name 'study_data_*.db' -mtime +7 -delete;
        fi;
        sleep 7200;
      done"