<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kwestionariusz Wstępny | Badanie SWPS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#00455E] text-white min-h-screen py-10 px-4">
    <div class="max-w-2xl mx-auto bg-[#003447] border-2 border-[#002634] rounded-3xl p-6 md:p-8 shadow-2xl">
        
        <h1 class="text-2xl font-black text-[#FFAE00] mb-2 text-center">KWESTIONARIUSZ WSTĘPNY</h1>
        <p class="text-xs text-slate-300 text-center mb-6">Wypełnij poniższe pytania metryczkowe przed przejściem do instrukcji badania.</p>

        <form id="study-form" action="/start-session" method="POST" class="space-y-6">
            
            <div>
                <label class="block text-sm font-semibold mb-1">1. Wiek:</label>
                <input type="number" name="age" min="18" max="99" required class="w-full bg-[#002634] border border-[#00455E] rounded-xl px-4 py-3 text-white focus:outline-none focus:border-[#FFAE00]">
            </div>

            <div>
                <label class="block text-sm font-semibold mb-1">2. Płeć:</label>
                <select name="gender" required class="w-full bg-[#002634] border border-[#00455E] rounded-xl px-4 py-3 text-white focus:outline-none focus:border-[#FFAE00]">
                    <option value="" disabled selected>Wybierz opcję...</option>
                    <option value="kobieta">Kobieta</option>
                    <option value="mezczyzna">Mężczyzna</option>
                    <option value="inna">Inna / Nie chcę podawać</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-semibold mb-1">3. Doświadczenie w IT, AI lub grafice:</label>
                <div class="flex gap-6 mt-2">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="radio" name="it_experience" value="1" required class="accent-[#FFAE00]"> Tak
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="radio" name="it_experience" value="0" required class="accent-[#FFAE00]"> Nie
                    </label>
                </div>
            </div>

            <div>
                <label class="block text-sm font-semibold mb-1">4. Styczność z mediami społecznościowymi:</label>
                <select name="social_media" required class="w-full bg-[#002634] border border-[#00455E] rounded-xl px-4 py-3 text-white focus:outline-none focus:border-[#FFAE00]">
                    <option value="" disabled selected>Wybierz opcję...</option>
                    <option value="low">Rzadko / Prawie w ogóle</option>
                    <option value="medium">Kilkanaście minut do godziny dziennie</option>
                    <option value="high">1–3 godziny dziennie</option>
                    <option value="very_high">Powyżej 3 godzin dziennie</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-semibold mb-2">
                    5. Ocena własnej zdolności do rozpoznawania obrazów AI (1–7):
                </label>
                <div class="grid grid-cols-7 gap-1 text-center">
                    {% for i in range(1, 8) %}
                    <label class="cursor-pointer">
                        <input type="radio" name="self_assessment" value="{{ i }}" required class="sr-only peer">
                        <div class="py-3 bg-[#002634] border border-[#00455E] rounded-xl peer-checked:bg-[#FFAE00] peer-checked:text-[#00455E] font-bold transition">
                            {{ i }}
                        </div>
                    </label>
                    {% endfor %}
                </div>
            </div>

            <button type="submit" class="w-full py-4 bg-[#FFAE00] hover:bg-[#e69d00] text-[#00455E] font-black text-lg rounded-2xl shadow-xl transition transform active:scale-95">
                PRZEJDŹ DO INSTRUKCJI ➔
            </button>
        </form>
    </div>
</body>
</html>
