<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etap 2: Moduł Interaktywny | Badanie SWPS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes pulse-ring {
            0% {
                transform: translate(-50%, -50%) scale(0.95);
                box-shadow: 0 0 0 0 rgba(255, 174, 0, 0.75);
            }
            70% {
                transform: translate(-50%, -50%) scale(1.04);
                box-shadow: 0 0 0 14px rgba(255, 174, 0, 0);
            }
            100% {
                transform: translate(-50%, -50%) scale(0.95);
                box-shadow: 0 0 0 0 rgba(255, 174, 0, 0);
            }
        }
        .hotspot-zone {
            transform: translate(-50%, -50%);
            transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1),
                        background-color 0.3s ease,
                        border-color 0.3s ease,
                        box-shadow 0.3s ease;
        }
        .hotspot-zone:hover {
            transform: translate(-50%, -50%) scale(1.22);
            z-index: 30;
        }
        .hotspot-unvisited {
            animation: pulse-ring 2s infinite;
        }
        .hotspot-unvisited:hover {
            animation: none;
        }
        @keyframes fadeSlideUp {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .animate-panel-reveal {
            animation: fadeSlideUp 0.32s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
    </style>
</head>
<body class="bg-[#00455E] text-white min-h-screen flex flex-col justify-between items-center p-4 select-none">

    <header class="w-full max-w-5xl my-1 space-y-2">
        <div class="flex justify-between items-center text-xs text-slate-300 font-bold">
            <span id="step-counter">Etap 2 (Moduł interaktywny): Karta 1 z 5</span>
            <span>ID: {{ session_id }}</span>
        </div>
        <div class="w-full bg-[#002634] rounded-full h-2 overflow-hidden border border-[#00455E]">
            <div id="progress-bar" class="bg-[#FFAE00] h-full transition-all duration-500 ease-out" style="width: 20%"></div>
        </div>
    </header>

    <main class="w-full max-w-5xl bg-[#003447] border-2 border-[#002634] rounded-3xl p-5 md:p-8 shadow-2xl my-auto flex flex-col items-center space-y-6">
        <div class="text-center space-y-1.5 max-w-2xl">
            <h1 id="card-title" class="text-xl md:text-2xl font-black text-[#FFAE00] tracking-tight"></h1>
            <p id="card-instruction" class="text-xs md:text-sm text-slate-200"></p>
        </div>

        <!-- Główna scena interaktywna: dopasowany obrazek po lewej + panel opisu po prawej -->
        <div class="w-full flex flex-col lg:flex-row items-center justify-center gap-6 lg:gap-8">

            <!-- Kontener dopasowujący się dokładnie do proporcji wyświetlonego zdjęcia -->
            <div class="flex items-center justify-center w-full lg:w-auto">
                <div id="image-stage" class="relative inline-block rounded-2xl border-2 border-[#002634] bg-[#002634] shadow-2xl overflow-visible">
                    <img id="stage-image" src="" alt="Materiał do analizy"
                         class="block max-h-[340px] sm:max-h-[410px] w-auto h-auto max-w-full rounded-2xl object-contain transition-opacity duration-300">
                    <div id="hotspots-layer" class="absolute inset-0"></div>
                </div>
            </div>

            <!-- Panel inspektora szczegółów -->
            <div class="w-full lg:w-[400px] shrink-0 bg-[#002634] border border-[#00455E] rounded-2xl p-6 min-h-[250px] flex flex-col justify-between shadow-xl">
                <div id="inspector-content" class="space-y-3">
                    <div class="flex items-center justify-between">
                        <span id="inspector-badge" class="text-[11px] uppercase tracking-wider font-extrabold px-2.5 py-1 rounded-full bg-[#003447] text-[#FFAE00] border border-[#FFAE00]/30">
                            Oczekiwanie na wybór
                        </span>
                        <span id="inspector-step" class="text-xs font-bold text-slate-400">0 / 2</span>
                    </div>
                    <h2 id="spot-title" class="text-lg font-black text-white leading-snug">
                        Wybierz podświetloną strefę na obrazie
                    </h2>
                    <p id="spot-desc" class="text-sm text-slate-300 leading-relaxed">
                        Najedź kursorem na pulsujący okrąg na ilustracji i kliknij go, aby wyświetlić szczegółowe wyjaśnienie.
                    </p>
                </div>

                <!-- Szybkie przełączniki między 2 punktami na bieżącej karcie -->
                <div id="quick-tabs" class="grid grid-cols-2 gap-2 pt-4 mt-4 border-t border-[#00455E]/80"></div>
            </div>
        </div>

        <!-- Dolny pasek nawigacji karty -->
        <div class="w-full flex flex-col sm:flex-row items-center justify-between gap-3 pt-3 border-t border-[#00455E]">
            <div class="flex items-center gap-2 text-xs font-bold text-slate-300">
                <span id="status-dot" class="w-2.5 h-2.5 rounded-full bg-[#FFAE00]"></span>
                <span id="discovery-status">Zbadano stref: 0 z 2</span>
            </div>
            <button id="next-btn" onclick="nextCard()" disabled
                class="w-full sm:w-auto py-3 px-7 rounded-2xl bg-[#002634] text-slate-500 border-2 border-[#00455E] font-black text-sm tracking-wide transition-all duration-300 cursor-not-allowed">
                Zbadaj obie strefy, aby przejść dalej
            </button>
        </div>
    </main>

    <footer class="text-xs text-slate-300 my-1">
        Wydział Projektowania SWPS • Etap 2 z 3
    </footer>

    <script id="cards-data" type="application/json">
        {{ cards_json | safe }}
    </script>

    <script>
        history.pushState(null, "", location.href);
        window.addEventListener("popstate", () => {
            history.pushState(null, "", location.href);
        });

        const cards = JSON.parse(document.getElementById("cards-data").textContent);
        const sessionId = "{{ session_id }}";
        const groupType = "{{ group_type }}";
        const interventionStart = performance.now();

        let currentCardIndex = 0;
        let discoveredSet = new Set();
        let activeSpotIndex = null;

        const stepCounter = document.getElementById("step-counter");
        const progressBar = document.getElementById("progress-bar");
        const cardTitle = document.getElementById("card-title");
        const cardInstruction = document.getElementById("card-instruction");
        const stageImage = document.getElementById("stage-image");
        const hotspotsLayer = document.getElementById("hotspots-layer");
        const inspectorContent = document.getElementById("inspector-content");
        const inspectorBadge = document.getElementById("inspector-badge");
        const inspectorStep = document.getElementById("inspector-step");
        const spotTitle = document.getElementById("spot-title");
        const spotDesc = document.getElementById("spot-desc");
        const quickTabs = document.getElementById("quick-tabs");
        const discoveryStatus = document.getElementById("discovery-status");
        const statusDot = document.getElementById("status-dot");
        const nextBtn = document.getElementById("next-btn");

        // Wstępne pobranie wszystkich obrazków interwencji w tle
        cards.forEach(c => {
            const preload = new Image();
            preload.src = c.image_url;
        });

        function triggerInspectorAnimation() {
            inspectorContent.classList.remove("animate-panel-reveal");
            void inspectorContent.offsetWidth;
            inspectorContent.classList.add("animate-panel-reveal");
        }

        function updateUnlockState(totalSpots) {
            discoveryStatus.innerText = `Zbadano stref: ${discoveredSet.size} z ${totalSpots}`;
            inspectorStep.innerText = `${discoveredSet.size} / ${totalSpots}`;

            if (discoveredSet.size >= totalSpots) {
                statusDot.className = "w-2.5 h-2.5 rounded-full bg-emerald-400";
                nextBtn.disabled = false;
                nextBtn.className = "w-full sm:w-auto py-3 px-7 rounded-2xl bg-[#FFAE00] hover:bg-amber-400 text-[#00455E] border-2 border-[#FFAE00] font-black text-sm tracking-wide transition-all duration-300 cursor-pointer shadow-lg hover:scale-[1.02]";
                nextBtn.innerText = currentCardIndex < cards.length - 1 ? "Następny przykład →" : "Przejdź do testu końcowego →";
            } else {
                statusDot.className = "w-2.5 h-2.5 rounded-full bg-[#FFAE00]";
                nextBtn.disabled = true;
                nextBtn.className = "w-full sm:w-auto py-3 px-7 rounded-2xl bg-[#002634] text-slate-500 border-2 border-[#00455E] font-black text-sm tracking-wide transition-all duration-300 cursor-not-allowed";
                const left = totalSpots - discoveredSet.size;
                nextBtn.innerText = left === 1 ? "Zbadaj jeszcze 1 strefę" : `Zbadaj jeszcze ${left} strefy`;
            }
        }

        function selectHotspot(idx) {
            const card = cards[currentCardIndex];
            const spots = card.hotspots || [];
            const spot = spots[idx];
            if (!spot) return;

            discoveredSet.add(idx);
            activeSpotIndex = idx;

            inspectorBadge.innerText = groupType === "caricature"
                ? `Wskazówka diagnostyczna #${idx + 1}`
                : `Ciekawostka #${idx + 1}`;
            inspectorBadge.className = "text-[11px] uppercase tracking-wider font-extrabold px-2.5 py-1 rounded-full bg-emerald-950/80 text-emerald-300 border border-emerald-500/40";

            spotTitle.innerText = spot.label;
            spotDesc.innerText = spot.description;
            triggerInspectorAnimation();

            // Aktualizacja wyglądu znaczników na obrazie
            spots.forEach((_, i) => {
                const btn = document.getElementById(`hotspot-btn-${i}`);
                const tab = document.getElementById(`quick-tab-${i}`);
                const isVisited = discoveredSet.has(i);
                const isActive = i === activeSpotIndex;

                if (btn) {
                    btn.classList.remove("hotspot-unvisited");
                    if (isActive) {
                        btn.className = "hotspot-zone group absolute w-14 h-14 rounded-full bg-emerald-500/35 border-2 border-white ring-4 ring-emerald-400/50 flex items-center justify-center cursor-pointer z-20";
                    } else if (isVisited) {
                        btn.className = "hotspot-zone group absolute w-13 h-13 rounded-full bg-emerald-500/25 border-2 border-emerald-400 flex items-center justify-center cursor-pointer z-10";
                    }
                    const badge = btn.querySelector(".spot-core");
                    if (badge && isVisited) {
                        badge.className = "spot-core w-7 h-7 rounded-full bg-emerald-500 text-white font-black text-xs flex items-center justify-center shadow-md";
                        badge.innerText = "✓";
                    }
                }

                if (tab) {
                    if (isActive) {
                        tab.className = "py-2 px-3 rounded-xl bg-emerald-800/50 border border-emerald-400 text-xs font-bold text-white truncate transition cursor-pointer";
                    } else if (isVisited) {
                        tab.className = "py-2 px-3 rounded-xl bg-[#003447] border border-emerald-500/40 text-xs font-bold text-emerald-300 truncate transition cursor-pointer hover:bg-[#003f56]";
                    }
                }
            });

            updateUnlockState(spots.length);
        }

        function renderCard() {
            const card = cards[currentCardIndex];
            const spots = card.hotspots || [];
            discoveredSet = new Set();
            activeSpotIndex = null;

            stepCounter.innerText = `Etap 2 (Moduł interaktywny): Karta ${currentCardIndex + 1} z ${cards.length}`;
            progressBar.style.width = `${((currentCardIndex + 1) / cards.length) * 100}%`;
            cardTitle.innerText = card.title;
            cardInstruction.innerText = card.instruction;

            // Reset panelu inspektora
            inspectorBadge.innerText = "Oczekiwanie na wybór";
            inspectorBadge.className = "text-[11px] uppercase tracking-wider font-extrabold px-2.5 py-1 rounded-full bg-[#003447] text-[#FFAE00] border border-[#FFAE00]/30";
            spotTitle.innerText = "Kliknij podświetloną strefę na obrazie";
            spotDesc.innerText = "Najedź kursorem na pulsujący okrąg na ilustracji i kliknij go, aby wyświetlić szczegółowe wyjaśnienie.";
            triggerInspectorAnimation();

            stageImage.style.opacity = "0";
            stageImage.onload = () => {
                stageImage.style.opacity = "1";
            };
            stageImage.src = card.image_url;

            hotspotsLayer.innerHTML = "";
            quickTabs.innerHTML = "";

            spots.forEach((spot, idx) => {
                // Strefa na obrazku
                const btn = document.createElement("button");
                btn.type = "button";
                btn.id = `hotspot-btn-${idx}`;
                btn.style.left = `${spot.x}%`;
                btn.style.top = `${spot.y}%`;
                btn.setAttribute("aria-label", `Strefa ${idx + 1}: ${spot.label}`);
                btn.className = "hotspot-zone hotspot-unvisited group absolute w-14 h-14 rounded-full bg-[#FFAE00]/25 hover:bg-[#FFAE00]/40 border-2 border-dashed border-[#FFAE00] flex items-center justify-center cursor-pointer z-10";

                btn.innerHTML = `
                    <span class="spot-core w-7 h-7 rounded-full bg-[#FFAE00] text-[#00455E] font-black text-xs flex items-center justify-center shadow-lg transition-transform duration-200 group-hover:scale-110">
                        ${idx + 1}
                    </span>
                    <span class="pointer-events-none opacity-0 group-hover:opacity-100 transition-opacity duration-200 absolute -top-9 left-1/2 -translate-x-1/2 whitespace-nowrap bg-[#002634] text-white text-[11px] font-bold px-2.5 py-1 rounded-lg border border-[#FFAE00]/60 shadow-xl">
                        Zbadaj strefę #${idx + 1}
                    </span>
                `;

                btn.onclick = () => selectHotspot(idx);
                hotspotsLayer.appendChild(btn);

                // Dolny przycisk szybkiego podglądu
                const tab = document.createElement("button");
                tab.type = "button";
                tab.id = `quick-tab-${idx}`;
                tab.className = "py-2 px-3 rounded-xl bg-[#003447]/60 border border-[#00455E] text-xs font-bold text-slate-400 truncate transition cursor-pointer hover:border-[#FFAE00]/50 hover:text-slate-200";
                tab.innerText = `${idx + 1}. Strefa #${idx + 1}`;
                tab.onclick = () => selectHotspot(idx);
                quickTabs.appendChild(tab);
            });

            updateUnlockState(spots.length);
        }

        function nextCard() {
            if (nextBtn.disabled) return;

            if (currentCardIndex < cards.length - 1) {
                currentCardIndex++;
                renderCard();
            } else {
                nextBtn.disabled = true;
                nextBtn.innerText = "Zapisywanie postępu...";
                const durationSec = parseFloat(((performance.now() - interventionStart) / 1000).toFixed(2));
                fetch("/api/complete-intervention", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        session_id: sessionId,
                        duration_seconds: durationSec
                    })
                }).finally(() => {
                    window.location.replace(`/posttest?session_id=${sessionId}`);
                });
            }
        }

        renderCard();
    </script>
</body>
</html>
